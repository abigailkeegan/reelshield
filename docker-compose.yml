services:
  app:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # Persist the SQLite movie cache between container restarts
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
